<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalamanGPT - AI Image Generator</title>
  
  <!-- JSZip and FileSaver Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #c471ed 100%);
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Canvas Background */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 3D Floating Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      pointer-events: none;
      animation: float-orb 20s infinite ease-in-out;
      z-index: 0;
    }

    .orb1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(196, 113, 237, 0.8), transparent);
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .orb2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.6), transparent);
      top: 50%;
      right: 10%;
      animation-delay: 5s;
    }

    .orb3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(118, 75, 162, 0.7), transparent);
      bottom: 10%;
      left: 30%;
      animation-delay: 10s;
    }

    @keyframes float-orb {
      0%, 100% { 
        transform: translate(0, 0) scale(1);
      }
      25% { 
        transform: translate(50px, -50px) scale(1.1);
      }
      50% { 
        transform: translate(-30px, 30px) scale(0.9);
      }
      75% { 
        transform: translate(40px, 60px) scale(1.05);
      }
    }

    /* Smooth Mouse Follower - NO LAG */
    #mouseFollower {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.5),
        0 0 40px rgba(196, 113, 237, 0.4),
        inset 0 0 10px rgba(255, 255, 255, 0.2);
      animation: pulse-ring 2s infinite;
      /* Remove transition for instant movement */
      transition: none;
      will-change: transform;
    }

    @keyframes pulse-ring {
      0%, 100% { 
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.8;
      }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: transparent;
      border-radius: 0;
      padding: 50px 20px;
      position: relative;
      z-index: 1;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
      perspective: 1000px;
    }

    .logo h1 {
      font-size: 4em;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      text-shadow: 
        0 0 20px rgba(255, 255, 255, 1),
        0 0 40px rgba(196, 113, 237, 0.8),
        0 0 60px rgba(118, 75, 162, 0.6),
        0 5px 15px rgba(0, 0, 0, 0.5);
      animation: text-glow 3s ease-in-out infinite;
    }

    @keyframes text-glow {
      0%, 100% { 
        text-shadow: 
          0 0 20px rgba(255, 255, 255, 1),
          0 0 40px rgba(196, 113, 237, 0.8),
          0 0 60px rgba(118, 75, 162, 0.6),
          0 5px 15px rgba(0, 0, 0, 0.5);
      }
      50% { 
        text-shadow: 
          0 0 30px rgba(255, 255, 255, 1),
          0 0 60px rgba(196, 113, 237, 1),
          0 0 90px rgba(118, 75, 162, 0.8),
          0 10px 20px rgba(0, 0, 0, 0.6);
      }
    }

    .logo h1::before {
      content: '✨';
      position: absolute;
      left: -60px;
      animation: sparkle-left 2s infinite;
      font-size: 0.6em;
    }

    .logo h1::after {
      content: '✨';
      position: absolute;
      right: -60px;
      animation: sparkle-right 2s infinite 1s;
      font-size: 0.6em;
    }

    @keyframes sparkle-left {
      0%, 100% { 
        opacity: 1; 
        transform: scale(1) rotate(0deg); 
      }
      50% { 
        opacity: 0.5; 
        transform: scale(1.5) rotate(180deg); 
      }
    }

    @keyframes sparkle-right {
      0%, 100% { 
        opacity: 1; 
        transform: scale(1) rotate(0deg); 
      }
      50% { 
        opacity: 0.5; 
        transform: scale(1.5) rotate(-180deg); 
      }
    }

    .subtitle {
      text-align: center;
      color: #ffffff;
      margin-bottom: 50px;
      font-size: 1.3em;
      font-weight: 600;
      text-shadow: 
        0 2px 10px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(196, 113, 237, 0.6);
    }

    .prompt-section {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 25px;
      margin-bottom: 30px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 15px;
      color: #ffffff;
      font-size: 1.3em;
      text-shadow: 
        0 2px 5px rgba(0, 0, 0, 0.4),
        0 0 15px rgba(196, 113, 237, 0.5);
    }

    #promptInput {
      width: 100%;
      padding: 20px;
      font-size: 17px;
      border: 3px solid rgba(196, 113, 237, 0.6);
      border-radius: 18px;
      resize: vertical;
      font-family: 'Poppins', sans-serif;
      line-height: 1.7;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(10px);
      box-shadow: 
        0 5px 20px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    #promptInput:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 0 30px rgba(196, 113, 237, 0.8),
        0 5px 25px rgba(0, 0, 0, 0.3);
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.2);
    }

    #promptInput::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .character-count {
      text-align: right;
      margin-top: 12px;
      font-size: 16px;
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .input-row {
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .input-row label {
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .input-row input {
      padding: 16px 22px;
      font-size: 18px;
      border: 3px solid rgba(196, 113, 237, 0.6);
      border-radius: 15px;
      width: 220px;
      transition: all 0.3s ease;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .input-row input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 25px rgba(196, 113, 237, 0.7);
      background: rgba(255, 255, 255, 0.25);
    }

    .generate-btn {
      margin-top: 30px;
      padding: 22px 60px;
      font-size: 24px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 50%, rgba(196, 113, 237, 0.9) 100%);
      color: white;
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      cursor: pointer;
      font-weight: 800;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .generate-btn:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 15px 40px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(196, 113, 237, 0.8);
      background: linear-gradient(135deg, rgba(102, 126, 234, 1) 0%, rgba(118, 75, 162, 1) 50%, rgba(196, 113, 237, 1) 100%);
    }

    .generate-btn:active {
      transform: translateY(-2px);
    }

    .generate-btn:disabled {
      background: rgba(100, 100, 100, 0.4);
      color: rgba(255, 255, 255, 0.5);
      cursor: not-allowed;
      transform: none;
      border-color: rgba(150, 150, 150, 0.3);
    }

    #status {
      text-align: center;
      font-size: 22px;
      margin: 30px 0;
      padding: 22px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      font-weight: 700;
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(15px);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      box-shadow: 
        0 8px 25px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    #downloadAllBtn {
      display: none;
      margin: 30px auto;
      padding: 22px 60px;
      font-size: 24px;
      background: linear-gradient(135deg, rgba(17, 153, 142, 0.9), rgba(56, 239, 125, 0.9));
      color: white;
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      backdrop-filter: blur(10px);
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    #downloadAllBtn:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 15px 40px rgba(17, 153, 142, 0.6),
        0 0 40px rgba(56, 239, 125, 0.6);
      background: linear-gradient(135deg, rgba(17, 153, 142, 1), rgba(56, 239, 125, 1));
    }

    #imageGallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 30px;
      margin-top: 40px;
      padding: 35px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(15px);
      box-shadow: 
        0 10px 35px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    #imageGallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 
        0 8px 25px rgba(0, 0, 0, 0.4),
        0 0 0 3px rgba(255, 255, 255, 0.2);
      transition: all 0.4s ease;
      cursor: pointer;
      border: 3px solid rgba(196, 113, 237, 0.4);
    }

    #imageGallery img:hover {
      transform: scale(1.1) translateY(-10px) rotateZ(3deg);
      box-shadow: 
        0 15px 50px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(196, 113, 237, 0.8);
      border-color: rgba(255, 255, 255, 0.8);
      z-index: 10;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 15px;
      }

      .logo h1 {
        font-size: 2.5em;
        letter-spacing: 3px;
      }

      .logo h1::before,
      .logo h1::after {
        display: none;
      }

      .prompt-section {
        padding: 25px 20px;
      }

      #imageGallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
        padding: 25px;
      }

      .orb {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Mouse Follower -->
  <div id="mouseFollower"></div>

  <!-- Animated Canvas for Particles -->
  <canvas id="canvas"></canvas>

  <!-- Floating Orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="container">
    <div class="logo">
      <h1>SALAMANGPT</h1>
    </div>
    <p class="subtitle">🎨 Generate up to 2000 Unique AI Images with Detailed Prompts</p>

    <div class="prompt-section">
      <label for="promptInput">✍️ Enter Your Detailed Prompt (up to 5000 characters):</label>
      <textarea 
        id="promptInput" 
        rows="8" 
        maxlength="5000"
        placeholder="Write your detailed prompt here... You can write long descriptions up to 5000 characters.

Example: 
Create a stunning photorealistic image of a futuristic city at sunset with flying cars, neon lights reflecting on glass buildings, people walking on elevated walkways, holographic advertisements floating in the air, and a beautiful orange and purple sky in the background. The scene should have a cyberpunk aesthetic with detailed textures and dramatic lighting..."></textarea>
      
      <div class="character-count">
        <span id="charCount">0</span> / 5000 characters
      </div>
      
      <div class="input-row">
        <label for="countInput">🔢 Number of Images:</label>
        <input 
          type="number" 
          id="countInput" 
          min="1" 
          max="2000" 
          value="100" 
          placeholder="1-2000">
      </div>
      
      <button id="generateBtn" onclick="generateImages()" class="generate-btn">
        🚀 Generate Images
      </button>
    </div>

    <div id="status"></div>

    <button id="downloadAllBtn" onclick="downloadAllAsZip()">
      📥 Download All as ZIP
    </button>

    <div id="imageGallery"></div>
  </div>

  <script>
    // Canvas Particle Animation
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];
    let mouse = {
      x: null,
      y: null,
      radius: 150
    };

    window.addEventListener('mousemove', function(event) {
      mouse.x = event.x;
      mouse.y = event.y;
    });

    window.addEventListener('resize', function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });

    class Particle {
      constructor(x, y, directionX, directionY, size, color) {
        this.x = x;
        this.y = y;
        this.directionX = directionX;
        this.directionY = directionY;
        this.size = size;
        this.color = color;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        ctx.fillStyle = this.color;
        ctx.fill();
      }

      update() {
        if (this.x > canvas.width || this.x < 0) {
          this.directionX = -this.directionX;
        }
        if (this.y > canvas.height || this.y < 0) {
          this.directionY = -this.directionY;
        }

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < mouse.radius + this.size) {
          if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
            this.x += 3;
          }
          if (mouse.x > this.x && this.x > this.size * 10) {
            this.x -= 3;
          }
          if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
            this.y += 3;
          }
          if (mouse.y > this.y && this.y > this.size * 10) {
            this.y -= 3;
          }
        }

        this.x += this.directionX;
        this.y += this.directionY;
        this.draw();
      }
    }

    function init() {
      particlesArray = [];
      let numberOfParticles = (canvas.width * canvas.height) / 12000;
      
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 3) + 1;
        let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
        let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
        let directionX = (Math.random() * 0.4) - 0.2;
        let directionY = (Math.random() * 0.4) - 0.2;
        let color = 'rgba(255, 255, 255, 0.8)';

        particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
      }
    }

    function connect() {
      let opacityValue = 1;
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let distance = ((particlesArray[a].x - particlesArray[b].x) * 
                         (particlesArray[a].x - particlesArray[b].x)) + 
                         ((particlesArray[a].y - particlesArray[b].y) * 
                         (particlesArray[a].y - particlesArray[b].y));
          
          if (distance < (canvas.width / 7) * (canvas.height / 7)) {
            opacityValue = 1 - (distance / 20000);
            ctx.strokeStyle = 'rgba(196, 113, 237,' + opacityValue + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      connect();
    }

    init();
    animate();

    // ULTRA SMOOTH Mouse Follower - NO LAG
    const mouseFollower = document.getElementById('mouseFollower');
    
    document.addEventListener('mousemove', (e) => {
      // Direct positioning without any delay
      mouseFollower.style.left = e.clientX + 'px';
      mouseFollower.style.top = e.clientY + 'px';
    });

    // Main Application Logic
    let generatedImages = [];
    let isGenerating = false;

    // Character counter
    document.addEventListener('DOMContentLoaded', function() {
      const promptInput = document.getElementById('promptInput');
      const charCount = document.getElementById('charCount');
      
      if (promptInput && charCount) {
        promptInput.addEventListener('input', function() {
          const currentLength = this.value.length;
          charCount.textContent = currentLength;
          
          if (currentLength > 4500) {
            charCount.style.color = '#ffcccc';
          } else if (currentLength > 3000) {
            charCount.style.color = '#ffd699';
          } else {
            charCount.style.color = '#ffffff';
          }
        });
      }
    });

    async function generateImages() {
      if (isGenerating) {
        alert('⚠️ Generation already in progress!');
        return;
      }
      
      const prompt = document.getElementById('promptInput').value.trim();
      const count = parseInt(document.getElementById('countInput').value) || 100;
      
      if (!prompt) {
        alert('❌ Please enter a prompt!');
        return;
      }
      
      if (prompt.length < 10) {
        alert('❌ Please write a more detailed prompt (at least 10 characters)');
        return;
      }
      
      if (count > 2000) {
        alert('❌ Maximum 2000 images allowed!');
        return;
      }

      if (count < 1) {
        alert('❌ Please enter at least 1 image');
        return;
      }
      
      isGenerating = true;
      generatedImages = [];
      
      const statusDiv = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadAllBtn');
      const gallery = document.getElementById('imageGallery');
      const generateBtn = document.getElementById('generateBtn');
      
      gallery.innerHTML = '';
      
      statusDiv.textContent = `🎨 Generating ${count} unique images...`;
      downloadBtn.style.display = 'none';
      generateBtn.disabled = true;
      generateBtn.textContent = '⏳ Generating...';
      
      try {
        for (let i = 0; i < count; i++) {
          const response = await fetch('http://localhost:3000/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              prompt: prompt,
              variation: i + 1
            })
          });
          
          const data = await response.json();
          
          if (data.image) {
            generatedImages.push({
              data: data.image.data,
              type: data.image.type,
              name: `salamangpt_image_${i + 1}.png`
            });
            
            const percentage = Math.round(((i + 1) / count) * 100);
            statusDiv.textContent = `✨ Generated ${i + 1}/${count} images (${percentage}%)`;
          }
          
          if (i < 50) {
            displayImage(data.image);
          }
        }
        
        statusDiv.textContent = `✅ Successfully generated ${count} unique images!`;
        downloadBtn.style.display = 'block';
        
      } catch (error) {
        console.error('Error:', error);
        statusDiv.textContent = '❌ Error: ' + error.message;
      } finally {
        isGenerating = false;
        generateBtn.disabled = false;
        generateBtn.textContent = '🚀 Generate Images';
      }
    }

    async function downloadAllAsZip() {
      if (generatedImages.length === 0) {
        alert('❌ No images to download!');
        return;
      }
      
      const zip = new JSZip();
      const imgFolder = zip.folder("salamangpt_images");
      
      document.getElementById('status').textContent = '📦 Creating ZIP file...';
      
      for (let i = 0; i < generatedImages.length; i++) {
        const img = generatedImages[i];
        
        try {
          if (img.type === 'url') {
            const response = await fetch(img.data);
            const blob = await response.blob();
            imgFolder.file(img.name, blob);
          } else if (img.type === 'base64') {
            imgFolder.file(img.name, img.data, {base64: true});
          }
          
          if (i % 50 === 0 || i === generatedImages.length - 1) {
            document.getElementById('status').textContent = 
              `📦 Adding: ${i + 1}/${generatedImages.length}`;
          }
        } catch (err) {
          console.error('Error:', err);
        }
      }
      
      document.getElementById('status').textContent = '⬇️ Downloading...';
      
      const content = await zip.generateAsync({
        type: "blob",
        compression: "DEFLATE",
        compressionOptions: { level: 6 }
      });
      
      saveAs(content, `salamangpt_images_${Date.now()}.zip`);
      
      document.getElementById('status').textContent = 
        `✅ Downloaded ${generatedImages.length} images!`;
    }

    function displayImage(image) {
      const gallery = document.getElementById('imageGallery');
      const imgElement = document.createElement('img');
      
      if (image.type === 'url') {
        imgElement.src = image.data;
      } else if (image.type === 'base64') {
        imgElement.src = `data:image/png;base64,${image.data}`;
      }
      
      imgElement.alt = 'AI Generated Image';
      imgElement.loading = 'lazy';
      
      imgElement.onclick = function() {
        window.open(this.src, '_blank');
      };
      
      gallery.appendChild(imgElement);
    }
  </script>
</body>
</html>
