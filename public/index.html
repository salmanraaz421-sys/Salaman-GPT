<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SalamanGPT - Image AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">

  <div class="w-full max-w-4xl">
    <div class="flex items-center justify-center mb-10">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-cyan-500 flex items-center justify-center shadow-[0_0_25px_rgba(0,255,200,0.4)]">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke-width="2" stroke="white" class="w-9 h-9">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 6v6l4 2m6-4a10 10 0 11-20 0 10 10 0 0120 0z" />
          </svg>
        </div>

        <div>
          <h1 class="text-4xl font-extrabold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent uppercase tracking-widest drop-shadow-[0_0_20px_rgba(0,255,200,0.3)]">
            SalamanGPT
          </h1>
          <p class="text-slate-400 text-sm -mt-1 tracking-widest">AI Image Intelligence</p>
        </div>
      </div>
    </div>

    <div class="backdrop-blur-xl bg-slate-900/60 border border-slate-700 rounded-3xl p-6 shadow-xl">

      <label class="block text-sm mb-1">Prompt</label>
      <input
        id="prompt"
        class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 mb-4 text-slate-100 placeholder-slate-500"
        placeholder="e.g. ek lion cyberpunk style"
      >

      <div class="mb-4">
        <label for="image-count" class="block text-sm mb-2">Kitni images? (Max 100)</label>
        <input
            id="image-count"
            type="number"
            min="1"
            max="100"
            value="1"
            class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 mb-2"
        >
        <div class="flex gap-2 mt-2">
          <button class="count-btn px-4 py-2 rounded-lg bg-slate-800" data-count="1">1</button>
          <button class="count-btn px-4 py-2 rounded-lg bg-slate-800" data-count="4">4</button>
          <button class="count-btn px-4 py-2 rounded-lg bg-slate-800" data-count="10">10</button>
          <button class="count-btn px-4 py-2 rounded-lg bg-slate-800" data-count="25">25</button>
        </div>
      </div>

      <button
        id="generateBtn"
        class="w-full py-3 bg-emerald-500 rounded-2xl font-bold text-slate-900 hover:bg-emerald-400 transition"
      >
        Generate Images
      </button>

      <p id="status" class="mt-4 text-center text-slate-400 text-sm"></p>

      <div id="gallery" class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

    </div>
  </div>

  <script>
    const countInput = document.getElementById("image-count");
    let selectedCount = Number(countInput.value) || 1;

    // Input field change hone par selectedCount update karo
    countInput.addEventListener("input", () => {
        let val = Number(countInput.value);
        if (val < 1) val = 1;
        if (val > 100) val = 100; // Maximum limit set to 100
        countInput.value = val;
        selectedCount = val;
        document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("border", "border-emerald-400", "bg-emerald-800/50"));
    });

    // Buttons click hone par input field aur selectedCount update karo
    document.querySelectorAll(".count-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedCount = Number(btn.dataset.count);
        countInput.value = selectedCount; // Input field ko update karein
        document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("border", "border-emerald-400", "bg-emerald-800/50"));
        btn.classList.add("border", "border-emerald-400", "bg-emerald-800/50");
      });
    });

    // Default button style lagao
    document.querySelector('.count-btn[data-count="1"]').classList.add("border", "border-emerald-400", "bg-emerald-800/50");


    const generateBtn = document.getElementById("generateBtn");
    const promptInput = document.getElementById("prompt");
    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");

    // NEW LOGIC FOR SEQUENTIAL GENERATION AND STREAMED VIEW
    generateBtn.onclick = async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        alert("Prompt likho bhai 🙂");
        return;
      }
      
      const totalImagesToGenerate = selectedCount; // selectedCount user input se aayega
      let generatedCount = 0;
      statusEl.textContent = `SalamanGPT images bana raha hai... ⏳ (0/${totalImagesToGenerate})`;
      galleryEl.innerHTML = "";
      
      generateBtn.disabled = true; // Button ko disable kar dein
      
      try {
        for (let i = 0; i < totalImagesToGenerate; i++) {
            statusEl.textContent = `SalamanGPT images bana raha hai... ⏳ (${i}/${totalImagesToGenerate})`;

            // Har image ke liye alag request bhejte hain (count: 1 will be sent to the backend)
            const res = await fetch("/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt, count: 1 }) 
            });

            const data = await res.json();
            
            if (data.error || !Array.isArray(data.images) || data.images.length === 0) {
                console.error("Image generation failed:", data.error || "No image returned");
                statusEl.textContent = `Error while generating image ${i + 1}. Continuing...`;
                continue; 
            }
            
            const imgObj = data.images[0]; // Sirf pehli image ko lein
            
            // Image ko gallery mein display karein (Saath-saath view)
            const card = createGalleryCard(imgObj, generatedCount);
            galleryEl.appendChild(card);
            
            generatedCount++;
            statusEl.textContent = `SalamanGPT images bana raha hai... ⏳ (${generatedCount}/${totalImagesToGenerate})`;
        }

        if (generatedCount > 0) {
            statusEl.textContent = `Images Ready! 🎉 (${generatedCount} images generated)`;
        } else {
            statusEl.textContent = "koi image wapas nahi aayi :(";
        }

      } catch (err) {
        console.error(err);
        statusEl.textContent = "kuch ghalat ho gaya, console check karo.";
      } finally {
        generateBtn.disabled = false; // Kaam poora hone ke baad button ko enable kar dein
      }
    };
    
    // Helper function jo image card banata hai
    function createGalleryCard(imgObj, i) {
        const card = document.createElement("div");
        card.className = "p-3 bg-slate-900/80 border border-slate-700 rounded-2xl shadow-lg";

        const img = document.createElement("img");
        img.className = "rounded-xl mb-3 w-full";

        let imageSrc = "";
        if (imgObj.type === "url") {
            imageSrc = imgObj.data;
        } else if (imgObj.type === "base64") {
            imageSrc = "data:image/png;base64," + imgObj.data;
        } else {
            imageSrc = "";
        }

        if (imageSrc) {
            img.src = imageSrc;
        }

        const btn = document.createElement("button");
        btn.textContent = "Download";
        btn.className = "w-full py-2 bg-emerald-500 text-slate-900 font-semibold rounded-xl hover:bg-emerald-400 transition";
        btn.onclick = () => downloadImage(imageSrc, `salamangpt_${i+1}.png`);

        card.appendChild(img);
        card.appendChild(btn);
        return card;
    }

    function downloadImage(url, filename) {
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
  </script>
</body>
</html>
